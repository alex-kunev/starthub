# Next.js's own production build already minifies and optimizes the
# client bundle. Netlify's post-processing "Asset optimization" step can
# re-bundle/re-minify that output in a way that breaks modern async/await
# code (surfaces in the browser console as "regeneratorRuntime is not
# defined"), so it's disabled here rather than relying on a dashboard
# toggle someone has to remember.
[build.processing.js]
  bundle = false
  minify = false

[build.processing.css]
  bundle = false
  minify = false

[functions]
  directory = "netlify/functions"

# The frontend always calls /api/calendar (the path Vercel's zero-config
# serverless functions use natively, via api/calendar.js). On Netlify,
# functions instead live at /.netlify/functions/*, so this redirect makes
# the same frontend path work on either host without an env-var branch.
[[redirects]]
  from = "/api/calendar"
  to = "/.netlify/functions/calendar"
  status = 200

[[redirects]]
  from = "/api/bookmarks"
  to = "/.netlify/functions/bookmarks"
  status = 200
